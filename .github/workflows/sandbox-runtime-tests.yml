name: Sandbox Runtime Tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sandbox-runtime-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sandbox-runtime-unit:
    name: Sandbox Runtime Unit Tests
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: dify-agent-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dify-agent-runtime

      - name: Run unit tests
        run: cargo test --locked --all-targets

  sandbox-runtime-lint:
    name: Sandbox Runtime Lint
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: dify-agent-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dify-agent-runtime

      - name: Run clippy
        run: cargo clippy --locked --all-targets

  sandbox-runtime-integration:
    name: Sandbox Runtime Integration Tests
    runs-on: depot-ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: dify-agent-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dify-agent-runtime

      - name: Build and start runtime
        run: make integration-up

      - name: Run integration tests
        run: make integration-test

      - name: Dump container logs on failure
        if: failure()
        run: make integration-logs || true

      - name: Stop runtime container
        if: always()
        run: make integration-down

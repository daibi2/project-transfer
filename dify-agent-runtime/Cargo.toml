[package]
name = "dify-agent-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "shellctl sandbox runtime and dify-agent CLI (Rust)"
license = "Apache-2.0"
publish = false
default-run = "shellctl"

[lib]
name = "dify_agent_runtime"
path = "src/lib.rs"

[[bin]]
name = "shellctl"
path = "src/bin/shellctl.rs"

[[bin]]
name = "shellctl-sanitize-pty"
path = "src/bin/shellctl-sanitize-pty.rs"

[[bin]]
name = "shellctl-runner-exit"
path = "src/bin/shellctl-runner-exit.rs"

[[bin]]
name = "shellctl-runner"
path = "src/bin/shellctl-runner.rs"

[[bin]]
name = "dify-agent"
path = "src/bin/dify-agent.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
cap-std = "3"
futures-core = "0.3"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "service"] }
http = "1"
libc = "0.2"
mime_guess = "2"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
